<html>

<head>

<title>División</title>

</head>

<body>

<script>

//Componentes

let a;
let b;
let division;

//Pido valores

a=prompt("Dame un dividendo");
b=prompt("Dame un divisor");

//Floats

a=parseFloat(a);
b=parseFloat(b);

//División

division=a/b;

//Resultados

alert(division);

document.write("<h1>El resultado es:"+division+"</h1>")

</script>

</body>

</html>
