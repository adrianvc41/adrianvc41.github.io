 <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 08 — else if y switch</title>
    </head>
    <body>

        <h1>Ejercicio 08 — Estructuras condicionales else if y switch</h1>
        <p>En este ejercicio se trabaja con decisiones múltiples, corrección de errores de sintaxis y comparación entre else if y switch.</p>

        <script>

document.write("<h2>Parte 1: Ejemplo modificado</h2>");

var tarea = prompt("¿Has hecho los deberes? (si/no)");

if (tarea == "si") {
    document.write("<p>Puedes tomarte un descanso.</p>");
} else if (tarea == "no") {
    document.write("<p>A qué esperas.</p>");
} else {
    document.write("<p>No evites la pregunta.</p>");
}



document.write("<h2>Parte 2: Corrección de errores</h2>");


document.write("<h3>Ejercicio 1</h3>");

let numero = prompt("Ingresa un número:");

if (numero > 0) {
    alert("El número es positivo");
} else if (numero < 0) {
    alert("El número es negativo");
} else {
    alert("El número es cero");
}

document.write("<h3>Ejercicio 2</h3>");

let contraseña = prompt("Ingresa tu contraseña:");

if (contraseña === "secreto123") {
    document.write("<p>Contraseña correcta. Bienvenido.</p>");
} else {
    document.write("<p>Contraseña incorrecta. Inténtalo de nuevo.</p>");
}


document.write("<h3>Ejercicio 3</h3>");

let valor = null;

if (valor === null) {
    alert("El valor es nulo.");
} else {
    alert("El valor no es nulo.");
}

document.write("<p>La variable valor contiene null.</p>");


document.write("<h3>Ejercicio 4</h3>");

let num = parseInt(prompt("Ingresa un número:"));

if (num > 0 && num % 2 === 0) {
    console.log("El número es positivo y par.");
} else if (num > 0 && num % 2 !== 0) {
    console.log("El número es positivo e impar.");
} else {
    console.log("El número no es positivo.");
}

document.write("<p>Consulta la consola para ver el resultado del ejercicio 4.</p>");



document.write("<h2>Parte 3: Helado con else if</h2>");

var topping = prompt("¿Qué topping quieres? oreo, kitkat, galleta, huesitos u otro");

var precio = 0;
var helado = 1.90;
var precioFinal = 0;

if (topping == "oreo") {
    precio = 1;
} else if (topping == "kitkat") {
    precio = 1.50;
} else if (topping == "galleta") {
    precio = 0.75;
} else if (topping == "huesitos") {
    precio = 0.95;
} else {
    document.write("<p>No tenemos este topping, lo sentimos.</p>");
    precio = 0;
}

precioFinal = helado + precio;

document.write("<p>El helado cuesta " + precioFinal + " €</p>");



document.write("<h2>Parte 4: Helado con switch</h2>");

var topping2 = prompt("¿Qué topping quieres para la versión switch?");

var precio2 = 0;
var helado2 = 1.90;

switch (topping2) {

    case "oreo":
        precio2 = 1;
        break;

    case "kitkat":
        precio2 = 1.50;
        break;

    case "galleta":
        precio2 = 0.75;
        break;

    case "huesitos":
        precio2 = 0.95;
        break;

    default:
        document.write("<p>No tenemos este topping, lo sentimos.</p>");
        precio2 = 0;
}

var precioFinal2 = helado2 + precio2;

document.write("<p>El helado cuesta " + precioFinal2 + " €</p>");

        </script>

    </body>
    </html>
