<!DOCTYPE html>

    <html lang="es">

    <head>

        <meta charset="UTF-8">

        <title>Ejercicio 09 — Heladería</title>

    </head>

    <body>

        <h1>Ejercicio 09 — Heladería</h1>

        <p>En este ejercicio el usuario elige tamaño, sabor y topping de un helado, y el programa calcula el precio final.</p>

        <script>

		var preciototal = 0;

        var tamaño = prompt("Elige un tamaño: pequeño, mediano o grande.");
		
		if (tamaño == "pequeño"){
			preciototal +=1
		}
		
		else if (tamaño == "mediano") {
			preciototal += 2
		}
		
		else if (tamaño == "grande") {
			preciototal += 3
		}
		
		else {
			document.write("<p>Respuesta no válida.</p>")
		}
		
		
		var sabor = prompt("Elige un sabor: fresa, chocolate, vainilla o nata.");
		
		if (sabor == "nata"){
			preciototal += 0
		}
		
		else if (sabor == "vainilla"){
			preciototal += 0
		}
		
		else if (sabor == "fresa"){
			preciototal += 1
		}
		
		else if (sabor == "chocolate"){
			preciototal += 1
		}
		
		else {
			document.write("<p>Respuesta no válida.</p>")
		}
		
		
		var topping = prompt("Elige un topping: galleta, sirope, oreo o brownie.")
		
		if (topping == "galleta"){
			preciototal += 0.3
		}
		
		else if (topping == "sirope"){
			preciototal += 0.3
		}
		
		else if (topping == "oreo"){
			preciototal += 0.5
		}
		
		else if (topping == "brownie"){
			preciototal += 0.5
		}
		
		else {
			document.write ("<p>Respuesta no válida.</p>")
		}
		
		document.write ("<h1>El precio del helado es: " + preciototal.toFixed(2) +" €</h1>")
		
		   document.write('<img src="helado.JPG" alt="Helado" width="300">');
		
        </script>

    </body>

    </html>
