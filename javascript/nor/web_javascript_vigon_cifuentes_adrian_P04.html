 <!DOCTYPE html>
    <html lang="es">

    <body>

 
        <h1>Ejercicio 04 — Operadores lógicos</h1>

 <h1>Operadores lógicos</h1>
 
        <script>
		
		document.write("<h1>Resultados de operadores lógicos</h1>");
		
		document.write("<h2>Ejemplo apuntes</h2>")
		
			var A = 10;
			var B = 20;
 
		document.write("<p>(A < B && B < A): " + (A < B && B < A) + "</p>");
		document.write("<p>(A < B || B < A): " + (A < B || B < A) + "</p>");
		document.write("<p>!(A < B):" + (!(A < B)) + "</p>");
		
		document.write("<h2>Ejemplo mío</h2>")
		
		var C = 30;
		var D = 50;
		
		document.write("<p>(C < D && D > C):" + (C < D && D > C) + "</p>");
		document.write("<p>(C > D || D < C):" + (C > D || D < C)+"</p>");
		document.write("<p>!(C > D):" + (!(C > D)) + "</p>");
		
        </script>

 
    </body>
    </html>
