<html>

<head>

<title>Resta</title>

</head>

<body>

<script>

//Componentes

let a;
let b;
let resta;

//Pido valores

a=prompt("Dame un minuendo");

b=prompt("Dame un sustraendo");

//Floats

a=parseFloat(a);

b=parseFloat(b);

//Resta

resta=a-b;

//Resulatados

alert(resta);

document.write("<h1>El resultado es:" +resta+ "</h1>");

</script>

</body>

</html>
