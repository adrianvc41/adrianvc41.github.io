<html>

<head>

<title>Promedio</title>

</head>

<body>

<script>

//Componentes

let a;
let b;
let c;
let promedio;

//Pido valores

a=prompt("Dame un número");
b=prompt("Dame otro");
c=prompt("Dame otro");

//Floats

a=parseFloat(a);
b=parseFloat(b);
c=parseFloat(c);

//Operación

promedio=(a+b+c)/3;

//Resultado

alert(promedio);

document.write=("<h1>La solución es: "+promedio+"</h1>")

</script>

</body>

</html>
