<html>

<head>

<title>Suma</title>

</head>

<body>

<script>

//Componentes

let a;
let b;
let suma;

//Pido valores

a=prompt("Dame un sumando");
b=prompt("Dame otro");

//Floats

a=parseFloat(a);
b=parseFloat(b);

//Suma

suma=a+b;

//Resultados

alert(suma);

document.write("<h1>El resultado es:" +suma+ "</h1>");

</script>

</body>

</html>
